[project]
name = "p2a"
version = "0.0.1"
description = "Diagnosi di un repository scientifico prima dell'agentificazione"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
p2a = "p2a.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
